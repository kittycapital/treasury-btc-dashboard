<style>
:root{--bg0:#000;--bg1:#07070d;--bg2:#0d0d16;--bg3:#13131f;--bg4:#1a1a2a;--bdr:#1a1a2e;--bdr2:#282845;--t1:#e8e8f0;--t2:#b0b0c8;--t3:#8888a0;--t4:#686880;--g:#00ff88;--r:#ff4466;--b:#4488ff;--y:#ffcc00;--btc:#f7931a;--treasury:#4a7cff;--accent:#8b5cf6}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg0);color:var(--t1);line-height:1.6;min-height:100vh;overflow-x:hidden}
::selection{background:var(--b);color:#fff}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.hdr{padding:12px 28px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;background:var(--bg1);position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.hdr-title{font-weight:700;font-size:18px;color:#fff}
.page{max-width:960px;margin:0 auto;padding:20px 28px}
.stats-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;flex:1;min-width:120px}
.stat-card .label{font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-family:'JetBrains Mono',monospace;font-weight:700}
.stat-card .value{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace}
.stat-card .detail{font-size:10px;color:var(--t4);margin-top:2px;font-family:'JetBrains Mono',monospace}
.controls{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.period-btn{padding:6px 14px;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;cursor:pointer;font-size:.7rem;font-weight:500;color:var(--t3);transition:all .2s;white-space:nowrap;font-family:'Noto Sans KR',sans-serif}
.period-btn:hover{background:var(--bg3);border-color:var(--bdr2);color:var(--t1)}
.period-btn.on{background:var(--bg4);border-color:var(--y);color:var(--y);box-shadow:0 0 8px rgba(255,204,0,.06)}
.chart-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;overflow:hidden;margin-bottom:20px}
.chart-head{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px;border-bottom:1px solid var(--bdr);gap:8px}
.chart-head h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:.875rem;font-weight:600;color:var(--t1)}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.leg{display:flex;align-items:center;gap:4px;font-size:.65rem;color:var(--t3)}
.ldot{width:8px;height:8px;border-radius:50%}
.ldot.btc{background:var(--btc)}.ldot.treasury{background:var(--treasury)}
.chart-area{height:400px;position:relative;padding:12px 20px}
.source-row{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-top:1px solid var(--bdr);flex-wrap:wrap;gap:6px}
.source-row span{font-size:10px;color:var(--t4);font-family:'JetBrains Mono',monospace}
.share-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;margin-top:28px;background:var(--bg1);border:1px solid var(--bdr);border-radius:10px}
.share-bar-preview{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;font-family:'JetBrains Mono',monospace}
.share-bar-preview b{color:var(--t2);font-weight:600}
.share-bar-buttons{display:flex;align-items:center;gap:6px;flex-shrink:0}
.share-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--bdr2);background:var(--bg2);color:var(--t3);white-space:nowrap;font-family:inherit}
.share-btn:hover{transform:translateY(-1px);color:var(--t1)}
.share-btn svg{flex-shrink:0}
.share-btn--x:hover{border-color:#fff;color:#fff;background:var(--bg3)}
.share-btn--kakao:hover{border-color:#FEE500;color:#191919;background:#FEE500}
.share-btn--tg:hover{border-color:#26A5E4;color:#fff;background:rgba(38,165,228,.15)}
.share-btn--ig:hover{border-color:#E4405F;color:#fff;background:rgba(228,64,95,.15)}
.share-btn--copy:hover{border-color:var(--g);color:var(--g);background:rgba(0,255,136,.07)}
.inline-share{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0;border-top:1px solid var(--bdr)}
.inline-share .lbl{font-size:10px;color:var(--t4);margin-right:4px}
.inline-share .share-btn{padding:6px 10px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:999}
.toast{background:var(--bg4);border:1px solid var(--bdr2);border-left:3px solid var(--g);border-radius:8px;padding:10px 18px;font-size:12px;color:var(--t1);box-shadow:0 8px 32px rgba(0,0,0,.7);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){
.page{padding:12px 16px}.hdr{padding:8px 16px}.hdr-title{font-size:15px}
.stats-row{gap:6px}.stat-card{padding:10px 12px;min-width:80px}.stat-card .value{font-size:17px}.stat-card .label{font-size:8px}
.chart-area{height:280px;padding:10px}
.chart-head{padding:12px 14px}
.share-bar{flex-direction:column;gap:10px;align-items:stretch}
.share-bar-preview{max-width:100%}
.share-bar-buttons{justify-content:center;flex-wrap:wrap}
.share-btn .lbl{display:none}.share-btn{padding:8px 10px}
.inline-share .lbl{display:none}
}
@media(max-width:520px){
.page{padding:10px 10px}.chart-area{height:240px;padding:8px}
.stat-card .value{font-size:15px}

/* === Chart === */
function pearsonCorrelation(x,y){var pairs=x.map(function(v,i){return[v,y[i]];}).filter(function(p){return p[0]!==null&&p[1]!==null;});if(pairs.length<3)return 0;var n=pairs.length;var xA=pairs.map(function(p){return p[0];}),yA=pairs.map(function(p){return p[1];});var xM=xA.reduce(function(a,b){return a+b;})/n,yM=yA.reduce(function(a,b){return a+b;})/n;var num=0,dX=0,dY=0;for(var i=0;i<n;i++){var dx=xA[i]-xM,dy=yA[i]-yM;num+=dx*dy;dX+=dx*dx;dY+=dy*dy;}return num/Math.sqrt(dX*dY);}

Chart.defaults.color='#555';Chart.defaults.borderColor='rgba(255,255,255,0.06)';Chart.defaults.font.family="'Noto Sans KR',sans-serif";
var wmPlugin={id:'herdvibeWM',beforeDraw:function(c){var ctx=c.ctx,ca=c.chartArea;if(!ca)return;ctx.save();ctx.font='700 34px "Plus Jakarta Sans",sans-serif';ctx.fillStyle='rgba(255,255,255,0.035)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Herdvibe.com',(ca.left+ca.right)/2,(ca.top+ca.bottom)/2);ctx.restore();}};

function renderChart(startYear){
  if(!rawData)return;
  var labels,btc,treasury;
  if(startYear==='all'){labels=rawData.labels;btc=rawData.btc;treasury=rawData.treasury;}
  else{var si=rawData.labels.findIndex(function(l){return l>=startYear;});labels=rawData.labels.slice(si);btc=rawData.btc.slice(si);treasury=rawData.treasury.slice(si);}
  var r=pearsonCorrelation(btc,treasury);
  var validPoints=btc.filter(function(v,i){return v!==null&&treasury[i]!==null;}).length;
  var lastBtc=null,lastTreasury=null;
  for(var i=btc.length-1;i>=0;i--){if(btc[i]!==null&&lastBtc===null)lastBtc=btc[i];if(treasury[i]!==null&&lastTreasury===null)lastTreasury=treasury[i];if(lastBtc!==null&&lastTreasury!==null)break;}
  var corrEl=document.getElementById('stat-corr');
  corrEl.textContent=r>=0?'+'+r.toFixed(2):r.toFixed(2);
  corrEl.style.color=r>=0.5?'var(--g)':r>=0?'var(--accent)':'var(--r)';
  document.getElementById('stat-btc').textContent=lastBtc!==null?(lastBtc>=0?'+':'')+lastBtc.toFixed(2):'—';
  document.getElementById('stat-treasury').textContent=lastTreasury!==null?(lastTreasury>=0?'+':'')+lastTreasury.toFixed(2):'—';
  document.getElementById('stat-points').textContent=validPoints;
  document.getElementById('stat-range').textContent=labels[0]+' ~ '+labels[labels.length-1];
  document.getElementById('last-updated').textContent='Updated: '+(rawData.last_updated||'—');
  var displayLabels=labels.map(function(l){var p=l.split('-');return p[0]+'.'+(p[1]||'');});
  if(chartInstance)chartInstance.destroy();
  var ctx=document.getElementById('mainChart').getContext('2d');
  chartInstance=new Chart(ctx,{
    type:'line',plugins:[wmPlugin],
    data:{labels:displayLabels,datasets:[
      {label:'BTC 12M Change (z-score)',data:btc,borderColor:'#f7931a',borderWidth:2.5,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:'#f7931a',pointHoverBorderColor:'#fff',pointHoverBorderWidth:2,tension:.3,fill:false,spanGaps:true,order:1},
      {label:'Treasury QE 12M Change (z-score)',data:treasury,borderColor:'#4a7cff',borderWidth:2.5,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:'#4a7cff',pointHoverBorderColor:'#fff',pointHoverBorderWidth:2,tension:.3,fill:false,spanGaps:true,order:2}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'rgba(10,10,10,.95)',titleColor:'#e8e8f0',bodyColor:'#8888a0',borderColor:'rgba(255,255,255,.08)',borderWidth:1,padding:12,cornerRadius:8,
          titleFont:{family:"'JetBrains Mono',monospace",size:11,weight:'400'},bodyFont:{family:"'JetBrains Mono',monospace",size:12,weight:'500'},
          displayColors:true,boxWidth:8,boxHeight:8,boxPadding:4,
          callbacks:{label:function(ctx){if(ctx.raw===null)return null;var val=ctx.raw>=0?'+'+ctx.raw.toFixed(2):ctx.raw.toFixed(2);return' '+ctx.dataset.label.split(' ')[0]+': '+val+'\u03C3';}}
        },
        annotation:{annotations:{
          zeroLine:{type:'line',yMin:0,yMax:0,borderColor:'rgba(136,136,160,0.2)',borderWidth:1,borderDash:[4,4]},
          corrLabel:{type:'label',xValue:displayLabels[Math.floor(displayLabels.length*0.65)],yValue:Math.max.apply(null,btc.filter(function(v){return v!==null;}))*0.85,
            content:['r = '+(r>=0?'+':'')+r.toFixed(2)],
            font:{family:"'JetBrains Mono',monospace",size:14,weight:'600'},
            color:r>=0.5?'#00ff88':r>=0?'#8b5cf6':'#ff4466',
            backgroundColor:'rgba(10,10,10,.8)',borderColor:'rgba(255,255,255,.05)',borderWidth:1,borderRadius:6,padding:{top:6,bottom:6,left:10,right:10}}
        }}
      },
      scales:{
        x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{family:"'JetBrains Mono',monospace",size:11},color:'#555',maxRotation:0,autoSkip:true,maxTicksLimit:12},border:{color:'rgba(255,255,255,.03)'}},
        y:{grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{family:"'JetBrains Mono',monospace",size:11},color:'#555',callback:function(v){return v.toFixed(1)+'\u03C3';}},border:{color:'rgba(255,255,255,.03)'},title:{display:true,text:'12-Month Change (Z-Score)',font:{family:"'Noto Sans KR',sans-serif",size:12,weight:'500'},color:'#555'}}
      }
    }
  });
}

document.querySelectorAll('.period-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.period-btn').forEach(function(b){b.classList.remove('on');});
    btn.classList.add('on');
    renderChart(btn.dataset.start);
  });
});

async function loadData(){
  try{var response=await fetch('./data/combined_data.json');rawData=await response.json();document.getElementById('loading').style.display='none';renderChart('2021');makeInlineShare(document.getElementById('inlineShare'));makeShareBar(document.getElementById('shareBarWrap'));}
  catch(err){document.getElementById('loading').innerHTML='데이터 로드 실패';console.error(err);}
}

(function(){var lastH=0;setInterval(function(){if(window.parent!==window){var h=document.body.scrollHeight;if(h!==lastH){lastH=h;window.parent.postMessage({type:'resize',height:h},'*');}}},300);})();

document.addEventListener('DOMContentLoaded',loadData);
</script>
