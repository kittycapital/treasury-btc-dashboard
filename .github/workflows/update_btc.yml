name: Update BTC Data

on:
  schedule:
    # 매일 UTC 06:00 (KST 15:00)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-btc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Fetch BTC daily price
        run: python scripts/fetch_btc.py

      - name: Process BTC to monthly
        run: python scripts/process_btc_monthly.py

      - name: Process combined data
        run: python scripts/process_combined.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📊 Update BTC data $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
